# ============================================================
# Workflow: Angular CI/CD
# Descripción: Integración y despliegue continuos del proyecto
#              Angular en GitHub Pages usando GitHub Actions.
# ============================================================

name: Angular CI/CD

# ── on ──────────────────────────────────────────────────────
# Se ejecuta en pull_request contra main (CI) y push a main (CI + CD)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Job: build (CI) ──────────────────────────────────────
  # Compila el proyecto Angular en una máquina limpia.
  # Si la compilación falla, la PR queda bloqueada.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npx ng build --base-href /cicd-angular/

      - name: Subir artefacto de Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cicd-angular/browser

  # ── Job: deploy (CD) ─────────────────────────────────────
  # Publica en GitHub Pages. Solo se ejecuta en push a main
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

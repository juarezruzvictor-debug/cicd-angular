# ============================================================
# Workflow: Angular CI/CD
# Descripción: Integración y despliegue continuos del proyecto
#              Angular en GitHub Pages usando GitHub Actions.
# ============================================================

name: Angular CI/CD

# ── on ──────────────────────────────────────────────────────
# Se ejecuta en dos situaciones:
#   1. pull_request contra main → solo CI (compilar).
#   2. push a main            → CI + CD (compilar y desplegar).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Job: build (CI) ──────────────────────────────────────
  # Compila el proyecto Angular en una máquina limpia.
  # Si la compilación falla, la PR queda bloqueada.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # Solo necesita leer el código

    steps:
      # 1. Descargar código – clona el repositorio
      - name: Descargar código
        uses: actions/checkout@v4

      # 2. Instalar Node 22 con caché de npm
      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Instalar dependencias con npm ci
      #    (usa package-lock.json, más rápido y reproducible)
      - name: Instalar dependencias
        run: npm ci

      # 4. Ejecutar tests unitarios con cobertura (extensión)
      - name: Ejecutar tests con cobertura
        run: npx ng test --coverage

      # 5. Compilar Angular con la base-href del repositorio
      - name: Compilar proyecto
        run: npx ng build --base-href /cicd-angular/

      # 6. Subir artefacto de Pages (solo en push, no en PR)
      - name: Subir artefacto de Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cicd-angular/browser

  # ── Job: deploy (CD) ─────────────────────────────────────
  # Publica en GitHub Pages. Solo se ejecuta en push a main
  # y después de que build haya terminado con éxito.
  deploy:
    runs-on: ubuntu-latest
    needs: build                             # Depende de build
    if: github.event_name == 'push'          # Solo en push a main

    permissions:
      pages: write                           # Escribir en Pages
      id-token: write                        # Token OIDC para Pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
